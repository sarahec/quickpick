[package]
name = "quickpick"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "qp"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
clapfig = "=0.25.0"
git2 = { version = "0.21.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"
