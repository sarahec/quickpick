[package]
name = "quickpick"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "qp"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
clapfig = "0.21.4"
git2 = { version = "0.21.0", default-features = false }
serde = "1.0.229"

[dev-dependencies]
tempfile = "3.27.0"
