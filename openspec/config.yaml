schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform
context: |
  This is a CLI tool to identify the work needed to synchronize
  a package from one branch to another in nixpkgs.
  For example: merging from `master` to `staging` or `master` to `release` 
  after fixing a bug.
  The problem is that `master`'s version may be multiple commits ahead,
  so a simple cherry-pick won't do. We need to identify a mix of commits and/or
  cherry picks that get us from the target version to the master version.
  Tech stack: Rust, Jujutsu (https://docs.jj-vcs.dev/latest/), Nix
  The developer shell comes from devenv (https://devenv.sh/)
  We use conventional commits


# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
rules:
  source:
    - Use Rust
    - Use documentation comments throughout
    - All code must compile, all tests must pass
    - Run clippy and fix any issues
    - Format with rustfmt
